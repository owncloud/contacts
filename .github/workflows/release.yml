name: Release

on:
  push:
    tags:
      - 'v*'
  # Rehearse the pipeline. With the dry-run condition below, a manual run skips the
  # tag-vs-info.xml check and the release creation, builds and signs exactly as a real
  # release does, and uploads the tarball as a workflow artifact instead - so the release
  # path can be exercised without burning a version or publishing anything.
  #
  # Note what this is *not*: a privilege boundary. workflow_dispatch reads the workflow
  # from the ref it runs against, so a branch can set dry-run itself; and the callee
  # writes the signing key to the runner before `make dist` executes ref-controlled code,
  # dry run or not. A `v*` tag push already grants exactly that (there is no tag
  # ruleset), so this adds convenience, not reach. Gate the key behind an environment
  # with required reviewers if that ever needs to change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: owncloud/reusable-workflows/.github/workflows/release.yml@main
    with:
      app-name: contacts
      # `make dist` emits two tarballs both named contacts.tar.gz (source and
      # appstore); publish only the appstore one. The source tarball is the whole
      # working tree, so it would both collide on the release asset name and trip
      # the workflow's development-files check.
      artifact-glob: build/artifacts/appstore/*.tar.gz
      # Publish only when this is a push of a v-tag; everything else is a dry run. Stated
      # as that positive invariant rather than as `event_name == 'workflow_dispatch'` so
      # that a trigger added here later cannot inherit "real release" by default - a
      # `push: branches: ['v*']`, say, would otherwise publish from a branch head.
      #
      # inputs.dry-run is not used because on a tag push the inputs context is empty, and
      # passing '' to the callee's boolean input is an error.
      dry-run: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
      SIGNING_CHAIN: ${{ secrets.SIGNING_CHAIN }}
